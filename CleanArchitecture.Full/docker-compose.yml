services:
  postgres:
    image: postgres:16
    container_name: accounts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: accountsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - accounts_postgres_data:/var/lib/postgresql/data

volumes:
  accounts_postgres_data:
